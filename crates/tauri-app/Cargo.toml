[package]
name = "local-agent-garden-tauri"
version = "1.5.0"
description = "Local Agent Garden — Tauri desktop shell"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "agent-garden-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Domain core — same library the CLI uses. ZERO duplication.
local-agent-garden-core = { workspace = true }

# Tauri 2.x
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
# OS login item for desktop.launch_at_login. Local-only: writes a LaunchAgent
# plist / registry key / .desktop entry — zero network, per PRIVACY.md.
tauri-plugin-autostart = "2"

# Shared workspace deps
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# File watcher — used by watcher.rs to subscribe to adapter watch_paths
notify = "6"

# System locale for tray copy (en/zh). Local read only, no network. The tray
# cannot reach web/i18n.js (native menus exist before the webview), so this is
# the system-shell layer's own locale signal.
sys-locale = "0.3"

# Tokio for async commands + debounce timer. Single-thread runtime to keep
# the binary small; we only use mpsc channels and sleep, no heavy concurrency.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
