<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Agent Garden</title>
<style>
:root {
  --color-background-secondary: #171b14;
  --color-text-primary: #f4ead8;
  --color-text-secondary: #b9af9b;
  --color-text-tertiary: #8f8778;
  --color-border-tertiary: rgba(255,255,255,0.12);
  --border-radius-lg: 10px;
  --border-radius-md: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: clamp(10px, 3vw, 20px);
  background: #10140f;
  color: var(--color-text-primary);
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow-x: hidden;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.pg6-wrap { max-width: 980px; min-width: 0; width: 100%; }
.pg6-wrap { padding: 0.5rem 0; }
.pg6-frame { background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 14px; }
.pg6-header { display: flex; justify-content: space-between; align-items: center; gap: 8px 14px; padding: 2px 6px 12px; flex-wrap: wrap; }
.pg6-app { font-size: 13px; font-weight: 500; color: var(--color-text-primary); letter-spacing: 0.3px; min-width: 0; }
.pg6-meta { font-size: 12px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-width: 0; }
.pg6-meta-item { display: flex; align-items: center; gap: 5px; }
.pg6-icon { color: currentColor; flex: 0 0 auto; height: 13px; width: 13px; }
.pg6-scene { position: relative; border-radius: var(--border-radius-md); overflow: hidden; line-height: 0; }
.pg6-scene svg { display: block; width: 100%; height: auto; }
.pg6-sprite {
  /* --vine-hue-shift is set per-project via JS to tint each vine by primary
     source (claude-code = 0deg / default; codex = bluer; mixed = somewhere
     in between). Non-project sprites keep the 0deg default → no tint. */
  filter: saturate(0.78) brightness(0.9) contrast(0.96) hue-rotate(var(--vine-hue-shift, 0deg));
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  pointer-events: auto;
  position: absolute;
  transform: var(--sprite-transform, translate(-50%, 0));
  transform-origin: top center;
  transition: filter 140ms ease, opacity 140ms ease, transform 140ms ease;
  user-select: none;
}
.pg6-sprite.project {
  cursor: pointer;
}
.pg6-sprite.vine-cap {
  filter: saturate(0.76) brightness(0.86) contrast(0.94) hue-rotate(var(--vine-hue-shift, 0deg));
  pointer-events: none;
  transform-origin: center center;
}
.pg6-sprite.vine-cornice {
  /* Match the vine tone (.pg6-sprite base filter) so cornice + vines read as
     one continuous plant rather than two stacked bands of foliage. */
  filter: saturate(0.78) brightness(0.92) contrast(0.96) hue-rotate(var(--vine-hue-shift, 0deg));
  pointer-events: none;
  transform-origin: bottom center;
}
.pg6-sprite.project:hover {
  filter: saturate(0.92) brightness(0.98) contrast(0.98) hue-rotate(var(--vine-hue-shift, 0deg));
  opacity: 0.92 !important;
  transform: var(--sprite-transform, translate(-50%, 0)) translateY(-3px) scale(1.04);
}
.pg6-sprite.project.is-active {
  filter: saturate(1.02) brightness(1.05) contrast(1.02) hue-rotate(var(--vine-hue-shift, 0deg));
  opacity: 0.96 !important;
}
.pg6-sprite.project:focus-visible {
  filter: saturate(0.98) brightness(1.03) contrast(1) hue-rotate(var(--vine-hue-shift, 0deg));
  outline: 2px solid rgba(244, 216, 120, 0.9);
  outline-offset: 2px;
  opacity: 0.95 !important;
  transform: var(--sprite-transform, translate(-50%, 0)) translateY(-3px) scale(1.04);
}
.pg6-sprite.ground {
  filter: saturate(0.72) brightness(0.86) contrast(0.92);
  transform-origin: bottom center;
}
/* Foreground objects (cherry / willow / shrine / pavilion / etc.) — full
   opacity, minimal filtering so the new pixel-art sprites read at their
   intended vividness. The .ground class stays for atmospheric stuff like
   grass tufts and small rocks that should recede. */
.pg6-sprite.object {
  filter: saturate(0.97) brightness(0.98);
  transform-origin: bottom center;
}
.pg6-sprite.flower {
  filter: saturate(0.82) brightness(0.92) contrast(0.96);
}
.pg6-sprite.mark {
  mix-blend-mode: multiply;
}
.pg6-wall-edge-cover {
  background: #48382a;
  height: clamp(2px, 0.8%, 6px);
  left: 0;
  opacity: 0.28;
  pointer-events: none;
  position: absolute;
  top: 25%;
  width: 100%;
  z-index: 15;
}
/* (.pg6-vine-seam-shadow removed — the cornice itself now does the green→brick
   transition. The shadow's tail extending below the cornice was reading as a
   visible horizontal line that re-introduced "two-layer" feel.) */
.pg6-info {
  position: absolute;
  left: var(--info-x, 14px);
  top: var(--info-y, auto);
  bottom: var(--info-bottom, 14px);
  background: rgba(28, 18, 10, 0.86); color: #f5ead8;
  padding: 10px 14px; border-radius: 8px;
  font-size: 12px; min-width: 180px; line-height: 1.5;
  opacity: 0; pointer-events: none;
  transform: translateY(4px);
  transition: opacity 180ms ease, transform 180ms ease;
  /* Sit above every vine (z~18-33), trinket (z~40+), and cornice (z=61+).
     Without this, hovering a wide vine would have its trailing leaves drape
     over the card and partially hide the text. */
  z-index: 200;
}
.pg6-info.is-visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
.pg6-trinket-sprite {
  cursor: pointer;
  transform-origin: center center;
}
.pg6-trinket-sprite:hover,
.pg6-trinket-sprite:focus-visible {
  filter: saturate(1.08) brightness(1.08);
  outline: 2px solid rgba(244, 216, 120, 0.82);
  outline-offset: 1px;
  transform: var(--sprite-transform, translate(-50%, -50%)) scale(1.18);
}
@media (prefers-reduced-motion: no-preference) {
  .pg6-trinket-sprite { animation: pg6-trinket-nod 3600ms ease-in-out infinite; }
  .pg6-sprite.project.hanging { animation: pg6-vine-sway 4200ms ease-in-out infinite; }
  .pg6-sprite.project.climbing { animation: pg6-vine-breathe 5200ms ease-in-out infinite; }
  .pg6-sprite.decor-lantern { animation: pg6-lantern-pulse 2200ms ease-in-out infinite; }
  .pg6-petal { animation: pg6-petal-fall var(--petal-duration, 9s) linear infinite; }
  @keyframes pg6-trinket-nod {
    0%, 100% { filter: saturate(0.97) brightness(0.98); }
    50%      { filter: saturate(1.05) brightness(1.06); }
  }
  @keyframes pg6-vine-sway {
    0%, 100% { filter: saturate(0.78) brightness(0.90) contrast(0.96) hue-rotate(var(--vine-hue-shift, 0deg)); }
    50%      { filter: saturate(0.88) brightness(0.96) contrast(0.98) hue-rotate(var(--vine-hue-shift, 0deg)); }
  }
  @keyframes pg6-vine-breathe {
    0%, 100% { opacity: 0.62; }
    50%      { opacity: 0.72; }
  }
  @keyframes pg6-lantern-pulse {
    0%, 100% { filter: saturate(1.02) brightness(0.98); }
    50%      { filter: saturate(1.14) brightness(1.14); }
  }
  @keyframes pg6-petal-fall {
    0%   { opacity: 0; transform: translate3d(0, -8px, 0) rotate(0deg); }
    10%  { opacity: 0.65; }
    90%  { opacity: 0.55; }
    100% { opacity: 0; transform: translate3d(var(--petal-drift, 18px), 120px, 0) rotate(160deg); }
  }
}
.pg6-info-label { opacity: 0.65; font-size: 11px; }
.pg6-info-name { font-weight: 500; margin: 2px 0 6px; font-size: 13px; }
.pg6-info-row { display: flex; justify-content: space-between; font-size: 11px; opacity: 0.85; }
.pg6-info-bar { margin-top: 7px; height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; overflow: hidden; }
.pg6-info-fill { width: 62%; height: 100%; background: #7ac46e; }
.pg6-project-strip { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 6px 0; }
.pg6-project-chip { align-items: center; background: none; border: 0; color: var(--color-text-secondary); cursor: pointer; display: inline-flex; flex: 0 1 180px; font: inherit; font-size: 11px; gap: 5px; max-width: 180px; min-width: 0; overflow: hidden; padding: 0; }
.pg6-project-chip::before { background: #6f9b48; content: ""; display: inline-block; flex: 0 0 auto; height: 8px; width: 8px; }
.pg6-project-chip strong { color: var(--color-text-primary); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg6-project-chip:hover,
.pg6-project-chip:focus-visible,
.pg6-project-chip.is-active { color: var(--color-text-primary); outline: none; }
.pg6-project-chip:hover::before,
.pg6-project-chip:focus-visible::before,
.pg6-project-chip.is-active::before { background: #9fd36d; box-shadow: 0 0 0 1px rgba(244, 216, 120, 0.35); }
.pg6-legend { display: flex; gap: 14px; padding: 12px 6px 2px; font-size: 11px; color: var(--color-text-secondary); flex-wrap: wrap; }
.pg6-legend-item { display: flex; align-items: center; gap: 6px; }
.pg6-legend-dot { width: 9px; height: 9px; border-radius: 1px; flex-shrink: 0; }
.pg6-footer { padding: 10px 6px 0; font-size: 11px; color: var(--color-text-tertiary); display: flex; align-items: center; gap: 5px; border-top: 0.5px solid var(--color-border-tertiary); margin-top: 12px; flex-wrap: wrap; }
.pg6-footer-freshness { color: var(--color-text-tertiary); margin-left: auto; }
.pg6-footer-freshness.is-stale { color: #d6a258; cursor: help; }
.pg6-sprite.cat-interactive { cursor: pointer; }
.pg6-sprite.cat-interactive:hover {
  filter: saturate(1.05) brightness(1.04);
  transform: var(--sprite-transform, translate(-50%, 0)) translateY(-2px) scale(1.03);
}
.pg6-sprite.cat-interactive:focus-visible {
  outline: 2px solid rgba(244, 216, 120, 0.9);
  outline-offset: 2px;
  filter: saturate(1.08) brightness(1.06);
  transform: var(--sprite-transform, translate(-50%, 0)) translateY(-2px) scale(1.03);
}
.pg6-empty {
  background: rgba(23, 27, 20, 0.84);
  border: 1px solid rgba(244, 234, 216, 0.14);
  border-radius: 8px;
  color: #f4ead8;
  left: 50%;
  line-height: 1.5;
  padding: 12px 16px;
  position: absolute;
  text-align: center;
  top: 58%;
  transform: translate(-50%, -50%);
  width: min(82%, 360px);
  z-index: 50;
}
.pg6-empty-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.pg6-empty-code { color: #b9af9b; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
.pg6-petal {
  background: #f4b8c8;
  height: 3px;
  left: var(--petal-x, 20%);
  opacity: 0;
  pointer-events: none;
  position: absolute;
  top: var(--petal-y, 70%);
  width: 2px;
  z-index: 45;
}
@media (max-width: 520px) {
  body { display: block; min-width: 0; }
  .pg6-wrap { margin: 0 auto; max-width: none; width: calc(100vw - 20px); }
  .pg6-frame { max-width: 100%; overflow: hidden; padding: 10px; width: 100%; }
  .pg6-header { align-items: flex-start; display: block; }
  .pg6-meta { gap: 8px; justify-content: flex-start; margin-top: 8px; }
  .pg6-project-strip { gap: 6px 10px; }
  .pg6-project-chip { flex-basis: calc(50% - 6px); max-width: calc(50% - 6px); }
  /* On narrow screens, the bottom-left info card covers most of the wall.
     Move it to the top edge as a thin strip — it overlays the sky area
     which has less critical detail. */
  .pg6-info {
    top: 8px; bottom: auto; left: 8px; right: 8px;
    min-width: 0; padding: 6px 10px;
    font-size: 11px; line-height: 1.35;
  }
  .pg6-info-name { font-size: 12px; margin: 1px 0 3px; }
  .pg6-info-bar { margin-top: 4px; }
}

/* Respect users who don't want motion. Filter/opacity changes still happen instantly. */
@media (prefers-reduced-motion: reduce) {
  .pg6-sprite,
  .pg6-info {
    animation: none !important;
    transition-duration: 0ms !important;
  }
}
</style>
</head>
<body>

<h2 class="sr-only">像素花园·春·傍晚:本机 AI agent 活动化作墙沿垂落或墙根攀爬的项目藤。使用 Tab 进入项目藤列表,左右方向键在藤之间切换。</h2>

<div class="pg6-wrap">
  <div class="pg6-frame">
    <div class="pg6-header">
      <div class="pg6-app">像素花园 · 你的数字庭院</div>
      <div class="pg6-meta">
        <span class="pg6-meta-item"><svg class="pg6-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c2-5 7-3 6 2 5-1 7 4 2 6 3 4-1 8-5 5-2 5-7 3-6-2-5 1-7-4-2-6-3-4 1-8 5-5Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg><span id="meta-season">春 · 谷雨</span></span>
        <span class="pg6-meta-item"><svg class="pg6-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16h16M7 20h10M6 12a6 6 0 0 1 12 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="meta-time">傍晚 · 18:42</span></span>
      </div>
    </div>
    <div class="pg6-scene" id="pg6-scene"></div>
    <div class="pg6-project-strip" id="project-strip" aria-label="项目藤列表"></div>
    <div class="pg6-legend">
      <div class="pg6-legend-item"><span class="pg6-legend-dot" style="background:#4a7235"></span><span id="legend-vines">项目藤 · 本地 agent 活动</span></div>
      <div class="pg6-legend-item"><span class="pg6-legend-dot" style="background:#7a7068"></span><span id="legend-courtyard">庭院物件 · 等待数据</span></div>
      <div class="pg6-legend-item"><span class="pg6-legend-dot" style="background:#e89aae"></span><span id="legend-bloom">花草 · 等待数据</span></div>
      <div class="pg6-legend-item"><span class="pg6-legend-dot" style="background:#f0a060"></span><span id="legend-light">夕阳 · 春日 18:42</span></div>
    </div>
    <div class="pg6-footer">
      <svg class="pg6-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 6v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6l8-3Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 12 3 3 5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>仅读取本机 agent 数据 · 零网络请求</span>
      <span id="data-freshness" class="pg6-footer-freshness"></span>
    </div>
  </div>
</div>

<script>
(function() {
  const W = 680, H = 440;
  const r = (x, y, w, h, c) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + c + '"/>';
  function hash(a, b) {
    const x = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453;
    return x - Math.floor(x);
  }

  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" role="img"><title>像素花园·春·傍晚</title><desc>本地 agent 活动化作墙沿垂落和墙根攀爬的项目藤</desc>';
  // <defs> — soft radial gradient for the setting-sun halo. Replaces the
  // earlier rectangular halo which showed as ghost squares against the
  // mountain sprites once those went sprite-art.
  s += '<defs>'
     + '<radialGradient id="pg6SunGlow" cx="50%" cy="50%" r="50%">'
     +   '<stop offset="0%"   stop-color="#f8b870" stop-opacity="0.62"/>'
     +   '<stop offset="45%"  stop-color="#f8b870" stop-opacity="0.26"/>'
     +   '<stop offset="100%" stop-color="#f8b870" stop-opacity="0"/>'
     + '</radialGradient>'
     + '</defs>';

  // === Wooden awning ============================================
  // Top eave with subtle pixel-art grain (knots + grooves).
  s += r(0, 0, W, 14, '#d4a070');
  s += r(0, 14, W, 6, '#a07248');
  s += r(0, 20, W, 4, '#604028');
  // grain: short darker pixel runs at irregular x positions
  for (let i = 0; i < 26; i++) {
    const gx = Math.floor(hash(i + 41, 9) * W);
    const gy = 3 + Math.floor(hash(i + 7, 13) * 4);
    const gw = 6 + Math.floor(hash(i, 19) * 14);
    if (hash(i + 71, 5) > 0.5) s += r(gx, gy, gw, 1, '#a87248');
    else s += r(gx, gy + 4, gw, 1, '#8a5a30');
  }
  // small knots
  for (let i = 0; i < 5; i++) {
    const kx = 40 + i * 130 + Math.floor(hash(i, 11) * 30);
    s += r(kx, 5, 3, 3, '#6a4020');
    s += r(kx, 5, 1, 1, '#3a2410');
  }

  // === Sky / clouds =============================================
  // Soft cream-pink cloud silhouettes BEFORE mountains so they sit
  // farther back in z-order.
  const clouds = [
    [60, 42, 38, 5, '#f0d0c0'],
    [110, 38, 22, 4, '#f4d8c8'],
    [320, 48, 30, 4, '#e8c4b8'],
    [600, 38, 46, 5, '#f0d0c0']
  ];
  for (const [cx, cy, cw, ch, col] of clouds) {
    // pixel-art puff: 3 vertically stacked rects of decreasing width
    s += r(cx, cy, cw, ch, col);
    s += r(cx + 3, cy - 3, cw - 6, 3, col);
    s += r(cx + 8, cy - 5, Math.max(2, cw - 16), 2, col);
  }

  // === Setting sun ==============================================
  // The halo is now a single SVG circle filled with a radial gradient — old
  // rgba rectangles showed as flat ghost squares against the mountain sprites.
  const sunX = 530, sunY = 46;
  // halo behind everything (will be partly covered by mountains, that's fine
  // — it pre-tints the sky so the horizon picks up dusk warmth)
  s += '<circle cx="' + (sunX + 13) + '" cy="' + (sunY + 11) + '" r="38" fill="url(#pg6SunGlow)"/>';
  // sun core (pixel-art disc)
  s += r(sunX, sunY, 26, 22, '#f0a060');
  s += r(sunX + 4, sunY - 4, 18, 4, '#f0a060');
  s += r(sunX + 4, sunY + 22, 18, 3, '#e08850');
  s += r(sunX - 3, sunY + 6, 3, 14, '#f0a060');
  s += r(sunX + 26, sunY + 6, 3, 14, '#f0a060');
  s += r(sunX - 8, sunY + 10, 4, 6, '#f8b870');
  s += r(sunX + 30, sunY + 8, 4, 6, '#f8b870');
  // inner highlight
  s += r(sunX + 6, sunY + 4, 6, 4, '#f8c878');
  s += r(sunX + 14, sunY + 12, 4, 3, '#f4a458');

  // === Mountains ================================================
  s += '<image href="../assets/sprites/mountains/mountains_far.png" x="-12" y="54" width="704" height="40" preserveAspectRatio="none" opacity="0.48"/>';
  // mountains_near now reaches y=110 (wall top, WT) so the silhouette meets
  // the brick wall edge without leaving a thin sky strip. Height bumped from
  // 34 to 38.
  s += '<image href="../assets/sprites/mountains/mountains_near.png" x="-10" y="72" width="700" height="38" preserveAspectRatio="none" opacity="0.56"/>';

  // Re-draw the sun in front of the mountain sprites; the first pass above
  // tints the horizon, this pass keeps the core readable. Halo is the same
  // radial gradient — softer than the original rectangle outlines.
  s += '<circle cx="' + (sunX + 13) + '" cy="' + (sunY + 11) + '" r="30" fill="url(#pg6SunGlow)" opacity="0.85"/>';
  s += r(sunX, sunY, 26, 22, '#f0a060');
  s += r(sunX + 4, sunY - 4, 18, 4, '#f0a060');
  s += r(sunX + 4, sunY + 22, 18, 3, '#e08850');
  s += r(sunX - 3, sunY + 6, 3, 14, '#f0a060');
  s += r(sunX + 26, sunY + 6, 3, 14, '#f0a060');
  s += r(sunX + 6, sunY + 4, 6, 4, '#f8c878');

  // birds — kept; they're tiny accents
  s += '<polyline points="285,68 290,65 295,68" stroke="#2a1d10" stroke-width="1" fill="none"/>';
  s += '<polyline points="300,72 305,69 310,72" stroke="#2a1d10" stroke-width="1" fill="none"/>';
  s += '<polyline points="430,60 437,56 444,60" stroke="#2a1d10" stroke-width="1" fill="none"/>';

  const WT = 110, WB = 380;
  const BW = 40, BH = 20;
  s += r(0, WT, W, WB - WT, '#48382a');

  const bricks = ['#9e8268', '#8c7058', '#a68a72', '#7a6048', '#94795f', '#b09682', '#82684f', '#a89072'];
  let rowI = 0;
  for (let y = WT; y < WB; y += BH) {
    const off = (rowI % 2) * (BW / 2);
    for (let col = -1; col * BW + off < W + BW; col++) {
      const bx = col * BW + off;
      const ci = Math.floor(hash(col + 50, rowI) * bricks.length);
      s += r(bx + 1, y + 1, BW - 2, BH - 2, bricks[ci]);
      if (hash(col + 13, rowI + 7) > 0.84) s += r(bx + 8, y + 8, 3, 2, '#5a4030');
      if (hash(col + 31, rowI + 19) > 0.92) s += r(bx + 24, y + 13, 2, 2, '#6e5440');
    }
    rowI++;
  }

  s += r(580, 180, 35, 30, 'rgba(40,28,18,0.18)');
  s += r(595, 168, 22, 14, 'rgba(40,28,18,0.12)');

  s += r(0, WB - 4, 50, 10, 'rgba(60,100,40,0.35)');
  s += r(0, WB - 8, 36, 8, 'rgba(70,110,45,0.4)');
  s += r(0, WB - 14, 22, 8, 'rgba(80,120,50,0.35)');
  s += r(0, WB - 22, 14, 8, 'rgba(70,110,45,0.3)');

  const scx = 388, scy = WT - 8;
  s += r(scx, scy + 4, 6, 4, '#4a4842');
  s += r(scx + 1, scy + 1, 4, 4, '#4a4842');
  s += r(scx, scy + 2, 2, 2, '#4a4842');
  s += r(scx + 4, scy + 2, 2, 2, '#4a4842');
  s += r(scx + 1, scy + 3, 1, 1, '#1a1a14');
  s += r(scx + 4, scy + 3, 1, 1, '#1a1a14');
  s += r(scx + 6, scy + 5, 4, 2, '#4a4842');
  s += r(scx - 1, scy + 7, 9, 1, '#3a3832');

  s += r(0, WB, W, H - WB, '#3a2a1a');
  s += r(0, WB - 2, W, 6, '#4f7228');
  s += r(0, WB + 4, W, 12, '#5e8a32');
  s += r(0, WB + 16, W, 12, '#6e9a38');
  s += r(0, WB + 28, W, H - WB - 28, '#5e7c2a');
  for (let i = 0; i < 80; i++) {
    const gx = (i * 11 + 5) % W;
    const gy = WB + 6 + (i % 5) * 6;
    const gh = 2 + Math.floor(hash(i, 5) * 3);
    s += r(gx, gy, 2, gh, '#3a5520');
  }
  const flCol = ['#f0c068', '#e08aa0', '#f0e090', '#d870a0', '#e8a058', '#f8e8ec'];
  for (let i = 0; i < 50; i++) {
    const fx = (i * 19 + 11) % W;
    const fy = WB + 12 + (i % 4) * 8;
    s += r(fx, fy, 2, 2, flCol[i % flCol.length]);
  }

  const gx = 480, gy = 220;
  for (let i = 0; i < 22; i++) s += r(gx + i * 2, gy, 2, 3, '#6a8244');
  for (let i = 2; i < 20; i++) s += r(gx + i * 2, gy + 2, 2, 1, '#8aa05a');
  s += r(gx + 44, gy + 1, 6, 2, '#6a8244');
  s += r(gx + 50, gy + 1, 5, 1, '#4a6230');
  s += r(gx - 5, gy - 1, 5, 3, '#6a8244');
  s += r(gx - 3, gy, 1, 1, '#1a1a0a');
  s += r(gx + 6, gy + 3, 2, 3, '#6a8244');
  s += r(gx + 5, gy + 5, 4, 1, '#6a8244');
  s += r(gx + 32, gy + 3, 2, 3, '#6a8244');
  s += r(gx + 31, gy + 5, 4, 1, '#6a8244');

  function butterfly(cx, cy, c1, c2) {
    cx = Math.round(cx); cy = Math.round(cy);
    return r(cx - 3, cy - 3, 3, 3, c1) + r(cx + 1, cy - 3, 3, 3, c1) + r(cx - 3, cy + 1, 3, 2, c2) + r(cx + 1, cy + 1, 3, 2, c2) + r(cx, cy - 2, 1, 5, '#2a1d10') + r(cx - 2, cy - 2, 1, 1, '#3a2a1a') + r(cx + 2, cy - 2, 1, 1, '#3a2a1a');
  }
  s += butterfly(230, 340, '#f4d878', '#e8b04a');
  s += butterfly(160, 380, '#f0c468', '#d49838');
  s += butterfly(470, 320, '#f4d878', '#e8b04a');

  for (let i = 0; i < 8; i++) {
    const px = 140 + i * 60 + (i % 3) * 15;
    const py = 420 + (i % 2) * 6;
    s += r(px, py, 2, 2, '#f4b8c8');
    if (hash(i, 22) > 0.5) s += r(px + 30, py + 3, 1, 1, '#f8c4d4');
  }

  s += '</svg>';

  document.getElementById('pg6-scene').innerHTML = s +
    '<div class="pg6-info" aria-live="polite" role="status">' +
      '<div class="pg6-info-label" id="garden-info-label">项目藤 · 当前选中</div>' +
      '<div class="pg6-info-name" id="garden-info-name">枝繁叶茂期</div>' +
      '<div class="pg6-info-row"><span id="garden-info-total">累计 580k</span><span id="garden-info-stage">阶段 4 / 6</span></div>' +
      '<div class="pg6-info-bar"><div class="pg6-info-fill" id="garden-info-fill"></div></div>' +
    '</div>';
})();
</script>

<script>
(function() {
  const scene = document.getElementById('pg6-scene');
  const spriteRoot = '../assets/sprites/';
  const manifestUrl = '../assets/sprites/ivy_courtyard_manifest.json';
  const dataUrl = './data/garden-summary.json';

  // ========================================================================
  // CONFIG — all unlock thresholds and trinket slot positions in one place.
  // Tune here without spelunking through render code.
  // ========================================================================
  const CONFIG = {
    // Pavilion size tier, by max single-project tokens
    pavilion: { full: 100_000_000, mid: 10_000_000 },           // anything below mid → 'small'

    // Cherry blossom state, by total recent_activity across projects
    cherry:   { petal: 100_000, bloom: 15_000 },                // below bloom → 'bud'

    // Willow becomes 'mature' when EITHER condition holds
    willow:   { mature_tokens: 10_000_000, mature_projects: 5 },

    // Stone-cat statue tier, by total sessions across projects.
    // (Previously called "shrine" — see addCourtyardObjects for the sprite
    // fallback so older shrine assets keep rendering until cat sprites land.)
    stone_cat: { full: 20, small: 4 },                           // below small → 'hidden'

    // Stool / cushion, by max single-project stage (1..6)
    stool:    { min_stage: 3 },
    cushion:  { min_stage: 4 },

    // Lamp is 'lit' if anything happened today
    // (no threshold tuning — strictly today-activity > 0)

    // Pavilion trinkets. slot.x / slot.y are % inside the pavilion's INTERIOR
    // bounding box (defined below), so they follow pavilion size changes.
    // w is the trinket's diameter in 680-unit scene coordinates.
    // file: sprite path under assets/sprites/.
    pavilionTrinkets: [
      { id: 'scroll',       threshold:   1_000_000, slot: { x: 50, y: 30 }, w:  8, name: '挂卷',     hint: '百万 token · 后墙挂卷',     file: 'pavilion_trinkets/trinket_scroll.png' },
      { id: 'tea_set',      threshold:  10_000_000, slot: { x: 30, y: 78 }, w: 13, name: '茶具',     hint: '千万 token · 案前茶具',     file: 'pavilion_trinkets/trinket_tea_set.png' },
      { id: 'lucky_cat',    threshold:  50_000_000, slot: { x: 72, y: 78 }, w: 10, name: '招财猫',   hint: '5 千万 token · 角落石猫',   file: 'pavilion_trinkets/trinket_lucky_cat.png' },
      { id: 'wind_chime',   threshold: 100_000_000, slot: { x: 80, y: 18 }, w:  7, name: '风铃',     hint: '亿 token · 檐下风铃',       file: 'pavilion_trinkets/trinket_wind_chime.png' },
      { id: 'incense',      threshold: 200_000_000, slot: { x: 42, y: 58 }, w: 10, name: '香炉',     hint: '两亿 token · 案上香炉',     file: 'pavilion_trinkets/trinket_incense.png' },
      { id: 'sleeping_cat', threshold: 500_000_000, slot: { x: 58, y: 76 }, w: 13, name: '睡猫',     hint: '五亿 token · 隐藏终极',     file: 'pavilion_trinkets/trinket_sleeping_cat.png' }
    ],

    // The pavilion sprite is a roof + columns + base; the "displayable" interior
    // is a sub-rectangle of the sprite. Fractions of pavilion bbox.
    pavilionInterior: { left: 0.16, right: 0.84, top: 0.30, bottom: 0.86 },

    // Aspect ratio per pavilion tier (height / width) — used to compute interior
    // bbox in scene coords. Pulled from manifest sprite sizes.
    pavilionAspect: { small: 223 / 152, mid: 257 / 289, full: 324 / 383 },

    // Pavilion placement on scene
    pavilionAnchor: { cx_pct: 82.5, bottom_pct: 90.5 },
    pavilionWidths: { small: 84, mid: 122, full: 160 }
  };

  Promise.all([
    fetch(manifestUrl).then((response) => response.json()),
    fetch(dataUrl).then((response) => response.ok ? response.json() : null).catch(() => null)
  ]).then(([manifest, summary]) => {
    const groups = {};
    for (const sprite of manifest.sprites || []) {
      if (!groups[sprite.group]) groups[sprite.group] = [];
      groups[sprite.group].push(sprite);
    }

    const projects = summary?.projects?.length ? summary.projects : [];
    const wallProjects = projectsForWall(projects);

    const tiers = unlockTier(summary, projects);

    updateHeaderMeta();              // #D5 real season/term/time-of-day
    updateDataFreshness(summary);    // #D1 "更新于 N 分钟前"
    updateDefaultInfo(summary, wallProjects);
    updateLegend(tiers, wallProjects);
    renderProjectStrip(wallProjects);
    addIvyOverlay(groups, wallProjects);
    addWallEdgeCover();
    addWallMarks(groups.plaster_patch || []);
    addGroundOverlay(groups);
    addCourtyardObjects(groups, tiers);
    addPavilionTrinkets(tiers.pavilion, tiers.pavilionTrinkets);
    addAmbientMotion(tiers);
    if (!projects.length) renderEmptyState();
  });

  // ==========================================================================
  // #D1 — data freshness in footer
  // ==========================================================================
  function updateDataFreshness(summary) {
    const el = document.getElementById('data-freshness');
    if (!el) return;
    const stamp = summary && summary.last_seen;
    if (!stamp) {
      el.textContent = '';
      return;
    }
    const last = new Date(stamp);
    const diff = Date.now() - last.getTime();
    const mins = Math.round(diff / 60_000);
    const hours = Math.round(diff / 3_600_000);
    const days = Math.round(diff / 86_400_000);
    let label;
    if (mins < 1)      label = '刚刚';
    else if (mins < 60) label = mins + ' 分钟前';
    else if (hours < 24) label = hours + ' 小时前';
    else if (days < 30)  label = days + ' 天前';
    else                 label = '一个月以上之前';
    el.textContent = '· 更新于 ' + label;
    if (diff > 24 * 3_600_000) {
      el.classList.add('is-stale');
      el.title = '运行 python3 -m local_agent_garden scan 刷新';
    } else {
      el.classList.remove('is-stale');
      el.removeAttribute('title');
    }
  }

  // ==========================================================================
  // #D5 — real-time header meta (season · solar term · time of day)
  // ==========================================================================
  // 24 solar terms, indexed by month*100+day. find latest <= today.
  const TERMS_24 = [
    [104, '小寒'], [120, '大寒'], [204, '立春'], [219, '雨水'],
    [305, '惊蛰'], [320, '春分'], [404, '清明'], [420, '谷雨'],
    [505, '立夏'], [521, '小满'], [605, '芒种'], [621, '夏至'],
    [707, '小暑'], [722, '大暑'], [807, '立秋'], [823, '处暑'],
    [907, '白露'], [923, '秋分'], [1008, '寒露'], [1023, '霜降'],
    [1107, '立冬'], [1122, '小雪'], [1207, '大雪'], [1222, '冬至']
  ];
  function currentSeason(d) {
    const m = d.getMonth() + 1;
    if (m === 12 || m <= 2) return '冬';
    if (m <= 5) return '春';
    if (m <= 8) return '夏';
    return '秋';
  }
  function currentSolarTerm(d) {
    const md = (d.getMonth() + 1) * 100 + d.getDate();
    let term = '冬至';   // wrap-around for early Jan before 小寒
    for (const [cut, t] of TERMS_24) if (md >= cut) term = t;
    return term;
  }
  function currentTimeOfDay(d) {
    const h = d.getHours();
    if (h < 5)  return '深夜';
    if (h < 10) return '清晨';
    if (h < 12) return '上午';
    if (h < 14) return '正午';
    if (h < 17) return '午后';
    if (h < 19) return '傍晚';
    if (h < 22) return '夜晚';
    return '深夜';
  }
  function updateHeaderMeta() {
    const now = new Date();
    const season = document.getElementById('meta-season');
    const time = document.getElementById('meta-time');
    if (season) season.textContent = currentSeason(now) + ' · ' + currentSolarTerm(now);
    if (time) {
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      time.textContent = currentTimeOfDay(now) + ' · ' + hh + ':' + mm;
    }
  }

  // ==========================================================================
  // #D2 — vine tint by primary source
  // claude-code-only      → 0deg   (default green)
  // codex-only            → -28deg (bluer, cool)
  // mixed                 → linear blend by codex share
  // unknown source        → 0deg
  // ==========================================================================
  function vineHueShift(project) {
    const sources = project && project.sources;
    if (!sources || typeof sources !== 'object') return null;
    const claude = sources['claude-code'] || sources['claude_code'] || 0;
    const codex = sources['codex'] || 0;
    const other = Object.entries(sources).reduce((sum, [k, v]) => {
      return (k === 'claude-code' || k === 'claude_code' || k === 'codex') ? sum : sum + (v || 0);
    }, 0);
    const total = claude + codex + other;
    if (total <= 0) return null;
    // codex share drives the shift; "other" sources nudge slightly warm
    const codexShare = codex / total;
    const otherShare = other / total;
    const deg = Math.round(-28 * codexShare + 14 * otherShare);
    return deg === 0 ? null : deg + 'deg';
  }

  function addCourtyardObjects(groups, tiers) {
    const pavilions = groups.pavilion_compact || [];
    const bamboo = groups.bamboo_cluster || [];
    const pathStones = groups.path_stones || [];
    const stools = groups.stone_stool || [];
    const cushions = groups.cushion || [];
    const cherries = groups.cherry_tree || [];
    const willows = groups.willow || [];
    // Prefer the new stone_cat sprite group; fall back to legacy shrine assets
    // so the page still renders during the asset migration.
    const stoneCats = (groups.stone_cat && groups.stone_cat.length)
      ? groups.stone_cat
      : (groups.shrine || []);
    const lanterns = groups.stone_lantern || [];
    const cairns = groups.stone_cairn || [];
    if (bamboo.length) {
      // A small grove of 3 clusters — back/mid/foreground — built from
      // distinct variants so it doesn't read as one repeated sprite.
      // Falls back gracefully if not all variants are in the manifest.
      const back  = namedSprite(bamboo, 'bamboo_cluster_03') || bamboo[0];
      const mid   = namedSprite(bamboo, 'bamboo_cluster_02') || bamboo[bamboo.length > 1 ? 1 : 0];
      const front = namedSprite(bamboo, 'bamboo_cluster_01') || bamboo[bamboo.length > 2 ? 2 : 0];
      // back row (taller, slightly farther left)
      addSprite(back,  { x:  6.5, y: 90.0, width: 58, z: 23, opacity: 0.95, className: 'object', anchor: 'bottom' });
      // mid row (fuller, anchors the grove)
      addSprite(mid,   { x: 12.5, y: 91.2, width: 68, z: 26, opacity: 0.97, className: 'object', anchor: 'bottom' });
      // foreground accent (smaller, in front for depth)
      addSprite(front, { x:  3.5, y: 92.4, width: 40, z: 29, opacity: 1.0,  className: 'object', anchor: 'bottom' });
    }
    if (cherries.length) {
      // Cherry is one of two visual anchors (with the pavilion). Sized to
      // roughly 60% of the pavilion full width so it reads as a peer object,
      // not a small accent.
      const sprite = namedSprite(cherries, tiers.cherry === 'bud' ? 'cherry_tree_bud' : 'cherry_tree_bloom') || pickByToken(cherries, 5);
      addSprite(sprite, {
        x: 23,
        y: 91.4,
        width: tiers.cherry === 'bud' ? 78 : 100,
        z: 22,
        opacity: 0.98,
        className: 'object decor-cherry',
        anchor: 'bottom'
      });
    }
    if (willows.length) {
      // Willow scales to ~75% of pavilion when mature — it should feel like
      // the biggest tree in the courtyard.
      const sprite = namedSprite(willows, tiers.willow === 'mature' ? 'willow_mature' : 'willow_young') || pickByToken(willows, tiers.willow === 'mature' ? 5 : 2);
      addSprite(sprite, {
        x: 48,
        y: 90.9,
        width: tiers.willow === 'mature' ? 125 : 95,
        z: 21,
        opacity: 0.98,
        className: 'object',
        anchor: 'bottom'
      });
    }
    if (tiers.stone_cat !== 'hidden' && stoneCats.length) {
      // Try new stone_cat names first, fall back to legacy shrine names.
      const wantFull = tiers.stone_cat === 'full';
      const sprite =
           namedSprite(stoneCats, wantFull ? 'stone_cat_full' : 'stone_cat_small')
        || namedSprite(stoneCats, wantFull ? 'shrine_full'    : 'shrine_small')
        || pickByToken(stoneCats, wantFull ? 5 : 2);
      const catImg = addSprite(sprite, {
        x: 34,
        y: 92.3,
        width: wantFull ? 58 : 46,
        z: 24,
        opacity: 1.0,
        className: 'object cat-interactive',
        anchor: 'bottom'
      });
      // #D3 — cat hover/focus reveals "guardian" info card
      if (catImg) {
        catImg.tabIndex = 0;
        catImg.setAttribute('role', 'img');
        catImg.setAttribute('aria-label', '石猫 · 镇园守护');
        catImg.title = '石猫 · 镇园守护';
        catImg.addEventListener('mouseenter', () => {
          updateInfoFromCat(tiers);
          positionInfoCardFromElement(catImg);
        });
        catImg.addEventListener('focus', () => {
          updateInfoFromCat(tiers);
          positionInfoCardFromElement(catImg);
        });
        catImg.addEventListener('mouseleave', hideInfoCard);
        catImg.addEventListener('blur', hideInfoCard);
      }
    }
    if (lanterns.length) {
      const sprite = namedSprite(lanterns, tiers.lamp === 'lit' ? 'stone_lantern_lit' : 'stone_lantern_unlit') || pickByToken(lanterns, tiers.lamp === 'lit' ? 5 : 1);
      addSprite(sprite, {
        x: 60,
        y: 91.5,
        width: 31,
        z: 25,
        opacity: 1.0,
        className: 'object decor-lantern',
        anchor: 'bottom'
      });
    }
    if (cairns.length) {
      // Cairn size piggybacks on the stone_cat tier (both grow with sessions).
      const wantFull = tiers.stone_cat === 'full';
      const sprite = namedSprite(cairns, wantFull ? 'stone_cairn_full' : 'stone_cairn_small')
                  || pickByToken(cairns, wantFull ? 5 : 2);
      addSprite(sprite, {
        x: 68,
        y: 92,
        width: wantFull ? 42 : 32,
        z: 25,
        opacity: 1.0,
        className: 'object',
        anchor: 'bottom'
      });
    }
    if (pathStones.length) {
      // Path stones intentionally stay on the .ground class — they're worn
      // and should recede rather than read as a foreground prop.
      addSprite(pathStones[0], {
        x: 55,
        y: 95.4,
        width: 168,
        z: 26,
        opacity: 0.62,
        className: 'ground',
        anchor: 'bottom'
      });
    }
    if (pavilions.length) {
      const pavilionIndex = { small: 1, mid: 3, full: 5 }[tiers.pavilion] || 1;
      const sprite = pickByToken(pavilions, pavilionIndex);
      addSprite(sprite, {
        x: 82.5,
        y: 90.5,
        width: pavilionWidth(tiers.pavilion),
        z: 24,
        opacity: 1.0,
        className: 'object',
        anchor: 'bottom'
      });
    }
    // Stool + cushion now live INSIDE the pavilion, centered on the floor
    // of its interior. Positions are derived from pavilionInteriorPoint so
    // they follow the pavilion tier (small/mid/full) automatically.
    // z = 25/26 places them in front of the pavilion sprite so they peek
    // through the open columns at the front.
    if (tiers.stool === 'visible' && stools.length) {
      const p = pavilionInteriorPoint(tiers.pavilion, 50, 96);
      addSprite(stools[0], {
        x: p.x,
        y: p.y,
        width: 26,
        z: 25,
        opacity: 1.0,
        className: 'object',
        anchor: 'bottom'
      });
    }
    if (tiers.cushion === 'visible' && cushions.length) {
      // Stack cushion on top of stool: stool height in scene-% ≈
      // (26 / 680) × (71 / 83) × (680 / 440) × 100 ≈ 5.05
      const stoolHeightPct = (26 / 680) * (71 / 83) * (680 / 440) * 100;
      const p = pavilionInteriorPoint(tiers.pavilion, 50, 96);
      addSprite(cushions[0], {
        x: p.x,
        y: p.y - stoolHeightPct,
        width: 18,
        z: 26,
        opacity: 1.0,
        className: 'object',
        anchor: 'bottom'
      });
    }
  }

  function projectsForWall(projects) {
    // The garden wall is a token-growth visualization, so visible vines are
    // ordered by token mass. Nothing is truncated: smaller projects still get
    // a thinner vine and a chip, because the garden is an archive, not a top-N
    // leaderboard.
    return [...projects]
      .sort((a, b) => (b.total_tokens || 0) - (a.total_tokens || 0));
  }

  function pavilionWidth(tier) {
    return CONFIG.pavilionWidths[tier] || CONFIG.pavilionWidths.small;
  }

  function unlockTier(summary, projects) {
    const list = projects || [];
    const totalTokens = summary?.total_tokens || list.reduce((sum, project) => sum + (project.total_tokens || 0), 0);
    const maxProjectTokens = Math.max(...list.map((project) => project.total_tokens || 0), 0);
    const totalSessions = list.reduce((sum, project) => sum + (project.sessions || 0), 0);
    const maxStage = Math.max(...list.map((project) => project.stage || 1), 1);
    const recentActivity = list.reduce((sum, project) => sum + (project.recent_activity || 0), 0);
    const now = new Date();
    const todayKey = [
      now.getFullYear(),
      String(now.getMonth() + 1).padStart(2, '0'),
      String(now.getDate()).padStart(2, '0')
    ].join('-');
    const todayActivity = list.reduce((sum, project) => {
      const daily = project.daily_activity || {};
      return sum + (daily[todayKey] || 0);
    }, 0);

    const trinkets = CONFIG.pavilionTrinkets
      .filter((t) => maxProjectTokens >= t.threshold)
      .map((t) => t.id);

    const c = CONFIG;
    return {
      totalTokens,
      maxProjectTokens,
      totalSessions,
      recentActivity,
      todayActivity,
      pavilion:
        maxProjectTokens >= c.pavilion.full ? 'full'
        : maxProjectTokens >= c.pavilion.mid ? 'mid'
        : 'small',
      cherry:
        recentActivity >= c.cherry.petal ? 'petal'
        : recentActivity >= c.cherry.bloom ? 'bloom'
        : 'bud',
      willow:
        (totalTokens >= c.willow.mature_tokens || list.length >= c.willow.mature_projects)
          ? 'mature' : 'young',
      stone_cat:
        totalSessions >= c.stone_cat.full ? 'full'
        : totalSessions >= c.stone_cat.small ? 'small'
        : 'hidden',
      lamp: todayActivity > 0 ? 'lit' : 'unlit',
      stool: maxStage >= c.stool.min_stage ? 'visible' : 'hidden',
      cushion: maxStage >= c.cushion.min_stage ? 'visible' : 'hidden',
      pavilionTrinkets: trinkets
    };
  }

  // ========================================================================
  // Pavilion trinket slot system.
  // Each trinket has a slot.{x,y} inside the pavilion's interior bounding box.
  // ========================================================================
  function addPavilionTrinkets(pavilionTier, unlockedIds) {
    if (!unlockedIds || !unlockedIds.length) return;
    const bbox = pavilionBoundingBox(pavilionTier);
    const int = CONFIG.pavilionInterior;
    const intLeft   = bbox.left + int.left   * bbox.width;
    const intTop    = bbox.top  + int.top    * bbox.height;
    const intWidth  = (int.right  - int.left) * bbox.width;
    const intHeight = (int.bottom - int.top)  * bbox.height;

    const unlocked = new Set(unlockedIds);
    CONFIG.pavilionTrinkets.forEach((tk, idx) => {
      if (!unlocked.has(tk.id)) return;
      const xPct = intLeft + (tk.slot.x / 100) * intWidth;
      const yPct = intTop  + (tk.slot.y / 100) * intHeight;
      if (tk.file) addTrinketSprite(tk, xPct, yPct, tk.w, idx);
    });
  }

  function addTrinketSprite(trinket, xPct, yPct, wUnits, idx) {
    const img = document.createElement('img');
    img.className = 'pg6-sprite object pg6-trinket-sprite';
    img.src = spriteRoot + trinket.file;
    img.alt = '';
    img.decoding = 'async';
    img.loading = 'eager';
    img.style.left = xPct + '%';
    img.style.top = yPct + '%';
    img.style.width = (wUnits / 680 * 100) + '%';
    img.style.zIndex = String(40 + idx);
    img.style.setProperty('--sprite-transform', 'translate(-50%, -50%)');
    img.tabIndex = 0;
    img.title = trinket.name + ' · ' + trinket.hint;
    img.setAttribute('aria-label', trinket.name + ', ' + trinket.hint);
    img.addEventListener('mouseenter', () => {
      updateInfoFromTrinket(trinket);
      positionInfoCardFromElement(img);
    });
    img.addEventListener('focus', () => {
      updateInfoFromTrinket(trinket);
      positionInfoCardFromElement(img);
    });
    img.addEventListener('mouseleave', hideInfoCard);
    img.addEventListener('blur', hideInfoCard);
    scene.append(img);
  }

  function pavilionInteriorPoint(tier, slotX, slotY) {
    // slotX / slotY are 0..100, relative to the pavilion's INTERIOR sub-box
    // (not the full sprite). Returns scene-percentage coords.
    const bbox = pavilionBoundingBox(tier);
    const int = CONFIG.pavilionInterior;
    const intLeft = bbox.left + int.left * bbox.width;
    const intTop  = bbox.top  + int.top  * bbox.height;
    const intW = (int.right  - int.left) * bbox.width;
    const intH = (int.bottom - int.top)  * bbox.height;
    return {
      x: intLeft + (slotX / 100) * intW,
      y: intTop  + (slotY / 100) * intH
    };
  }

  function pavilionBoundingBox(tier) {
    // Returns {left, top, width, height} in scene-percentage coords for the
    // pavilion sprite at the configured anchor.
    const widthUnits = pavilionWidth(tier);
    const widthPct = widthUnits / 680 * 100;
    // Sprite rendered height in scene-%:
    //   widthPct is % of scene width. Convert to scene height-% by accounting
    //   for the scene's pixel aspect (680/440) and the sprite's own aspect.
    const aspect = CONFIG.pavilionAspect[tier] || CONFIG.pavilionAspect.small;
    const heightPct = widthPct * aspect * (680 / 440);
    const cx = CONFIG.pavilionAnchor.cx_pct;
    const bottom = CONFIG.pavilionAnchor.bottom_pct;
    return {
      left: cx - widthPct / 2,
      top: bottom - heightPct,
      width: widthPct,
      height: heightPct
    };
  }

  function addAmbientMotion(tiers) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (tiers.cherry !== 'bloom' && tiers.cherry !== 'petal') return;

      petal.style.setProperty('--petal-duration', (7 + jitter(i, 55) * 5) + 's');

  function addIvyOverlay(groups, projects) {
    const hanging = groups.hanging_vine || [];
    const vertical = groups.vertical_vine || [];
    const leafCaps = groups.leaf_cluster || [];
    if (!hanging.length && !vertical.length) return;

    // Keep the order the strip uses (token desc). Chip #N then visually
    // aligns to the Nth vine from left to right. Slots are generated from the
    // actual project count so every project gets one vine without reusing the
    // old fixed six slots.
    const ordered = projects;
    const maxTokens = Math.max(...ordered.map((project) => project.total_tokens || 0), 1);
    const sortedTokens = ordered
      .map((project) => project.total_tokens || 0)
      .filter(Boolean)
      .sort((a, b) => b - a);
    const entries = ordered.map((project, projectIndex) => {
      const profile = tokenSizeProfile(project.total_tokens || 0, maxTokens, sortedTokens);
      const useHanging = profile.level >= 3 && hanging.length;
      return { project, projectIndex, profile, useHanging };
    });
    const hangingSlots = spreadSlots(entries.filter((entry) => entry.useHanging).length, 8, 92);
    const climbingSlots = spreadSlots(entries.filter((entry) => !entry.useHanging).length, 10, 90);
    let hangingIndex = 0;
    let climbingIndex = 0;
    const densityScale = ordered.length > 18 ? 0.66 : ordered.length > 12 ? 0.78 : ordered.length > 8 ? 0.88 : 1;
    const crownAnchors = [];

    entries.forEach(({ project, projectIndex, profile, useHanging }) => {
      const group = useHanging ? hanging : vertical;
      if (!group.length) return;

      const slot = useHanging
        ? hangingSlots[hangingIndex++]
        : climbingSlots[climbingIndex++];
      const sprite = pickByToken(group, profile.level);
      const width = Math.max(useHanging ? 24 : 13, profile.width * densityScale);

      const x = slot + (jitter(projectIndex, profile.level) - 0.5) * Math.min(2.2, 28 / Math.max(ordered.length, 1));
      const y = useHanging ? 24.65 + jitter(projectIndex, 2) * 0.42 : 52 + (5 - profile.level) * 4;
      const hue = vineHueShift(project);
      if (useHanging) crownAnchors.push({ x, y, projectIndex, profile, hue });

      addSprite(sprite, {
        x,
        y,
        width,
        z: useHanging ? 22 + projectIndex : 18 + projectIndex,
        opacity: profile.opacity,
        className: 'project ' + (useHanging ? 'hanging' : 'climbing'),
        anchor: useHanging ? 'top' : 'bottom',
        project,
        projectIndex,
        title: project.display_name
      });

    });

    addVineCornice(leafCaps, crownAnchors);
  }

  function addVineCornice(leafCaps, anchors) {
    if (!leafCaps.length || !anchors.length) return;
    addVineSeamBlend();
    const minX = Math.max(4, Math.min(...anchors.map((item) => item.x)) - 4.2);
    const maxX = Math.min(96, Math.max(...anchors.map((item) => item.x)) + 4.2);
    // Smaller tiles → thinner cornice band that doesn't extend high above
    // the vine tops. Was 28/32, now 22/26.
    const tileWidth = anchors.length > 12 ? 22 : 26;
    const step = tileWidth / 680 * 100 * 0.74;
    const count = Math.max(1, Math.ceil((maxX - minX) / step) + 1);

    for (let i = 0; i < count; i++) {
      const t = count === 1 ? 0 : i / (count - 1);
      const x = minX + (maxX - minX) * t + (jitter(i, 41) - 0.5) * 0.7;
      // Bigger ridge amplitude (was ±0.6, now up to ±1.5) so the cornice's
      // bottom edge isn't a flat horizontal line — some tiles ride high,
      // some hang lower like overgrown ivy clumps.
      const ridge = Math.sin(t * Math.PI) * 1.05 + Math.sin(i * 1.37) * 0.5;
      // Random extra drop on some tiles — produces the "a few clumps hanging
      // lower" look that real ivy clusters have.
      const drop = jitter(i, 73) > 0.6 ? jitter(i, 91) * 1.2 : 0;
      addSprite(pick(leafCaps, i), {
        x,
        // y bumped from 25.18 → 25.4 so the tile's bottom sits ON the wall
        // edge cover band (top: 25%) instead of floating above it. + drop
        // pushes individual tiles down into the wall for a draped look.
        y: 25.4 - ridge + drop,
        width: tileWidth,
        z: 61 + i,
        // opacity bumped from 0.54..0.59 → 0.78..0.85 so the cornice has the
        // same visual density as the vines (which sit at 0.70).
        opacity: 0.78 + Math.sin(i * 0.9) * 0.07,
        className: 'vine-cornice',
        anchor: 'bottom'
      });
    }
  }

  function addVineSeamBlend() {
    // No-op now. Kept as an explicit hook in case we want to re-introduce a
    // softer transition layer later — see history for the dark-gradient
    // approach that turned into a visible seam line.
  }

  function spreadSlots(count, min, max) {
    if (count <= 0) return [];
    if (count === 1) return [(min + max) / 2];
    const slots = [];
    for (let i = 0; i < count; i++) {
      const t = i / (count - 1);
      const wave = Math.sin(i * 1.7) * Math.min(1.8, 16 / count);
      slots.push(min + (max - min) * t + wave);
    }
    return slots;
  }

  function tokenSizeLevel(tokens, maxTokens) {
    if (tokens <= 0) return 1;
    const minLog = 3;
    const maxLog = Math.max(minLog + 1, Math.log10(maxTokens + 1));
    const ratio = (Math.log10(tokens + 1) - minLog) / (maxLog - minLog);
    return Math.max(1, Math.min(5, Math.ceil(ratio * 5)));
  }

  function tokenSizeProfile(tokens, maxTokens, sortedTokens) {
    const level = tokenSizeLevel(tokens, maxTokens);
    const rank = Math.max(0, sortedTokens.findIndex((value) => value === tokens));
    const count = Math.max(1, sortedTokens.length);
    const rankStrength = 1 - rank / Math.max(1, count - 1);
    const logStrength = tokens > 0 && maxTokens > 0
      ? Math.max(0, Math.min(1, (Math.log10(tokens + 1) - 4) / (Math.log10(maxTokens + 1) - 4)))
      : 0;
    const strength = Math.max(0, Math.min(1, logStrength * 0.68 + rankStrength * 0.32));

    if (level >= 3) {
      return {
        level,
        width: 28 + strength * 78,
        opacity: 0.48 + strength * 0.28
      };
    }

    return {
      level,
      width: 14 + strength * 24,
      opacity: 0.44 + strength * 0.18
    };
  }

  function pickByToken(group, level) {
    const index = Math.round((level - 1) / 4 * (group.length - 1));
    return group[Math.max(0, Math.min(group.length - 1, index))];
  }

  function addWallEdgeCover() {
    const edge = document.createElement('div');
    edge.className = 'pg6-wall-edge-cover';
    scene.append(edge);
  }

  function addWallMarks(patches) {
    if (!patches.length) return;

      [18, 49, 36], [56, 48, 32], [84, 57, 34]
    ];

    const stones = groups.stone_base || [];

      [[17, 86, 48], [78, 86, 44]].forEach(([x, y, width], i) => {

      });

        addSprite(pick(grasses, i), { x, y, width, z: 30, opacity: 0.58, className: 'ground' });
      });

  function addSprite(sprite, options) {
    const img = document.createElement('img');
    img.className = 'pg6-sprite' + (options.className ? ' ' + options.className : '');
    img.src = spriteRoot + sprite.file;
    img.alt = '';
    img.decoding = 'async';
    img.loading = 'eager';
    img.style.left = options.x + '%';
    img.style.top = options.y + '%';
    img.style.width = (options.width / 680 * 100) + '%';
    img.style.zIndex = String(options.z || 10);
    img.style.opacity = String(options.opacity ?? 1);
    if (options.anchor === 'bottom') {
      img.style.setProperty('--sprite-transform', 'translate(-50%, -100%)');
    } else {
      img.style.setProperty('--sprite-transform', 'translate(-50%, 0)');
    }
    if (options.title) img.title = options.title;
    if (options.hueShift) img.style.setProperty('--vine-hue-shift', options.hueShift);
    if (options.project) {
      img.classList.add('roving-vine');
      img.dataset.projectIndex = String(options.projectIndex ?? 0);
      // #D2 tint vine by primary source. codex-heavy projects skew blue-green,
      // claude-code-heavy stay default green, mixed lands in between.
      const hue = vineHueShift(options.project);
      if (hue) img.style.setProperty('--vine-hue-shift', hue);
      img.addEventListener('mouseenter', () => {
        setActiveProject(options.projectIndex ?? 0);
        updateInfoFromProject(options.project);
        // Anchor next to the vine (not under cursor). Cursor-follow used to
        // park the card inside the vine's leaf area where it got covered.
        positionInfoCardFromElement(img);
      });
      img.addEventListener('focus', () => {
        setActiveProject(options.projectIndex ?? 0);
        updateInfoFromProject(options.project);
        positionInfoCardFromElement(img);
      });
      img.addEventListener('mouseleave', () => {
        clearActiveProject();
        hideInfoCard();
      });
      img.addEventListener('blur', () => {
        clearActiveProject();
        hideInfoCard();
      });
      img.addEventListener('keydown', handleVineKey);
      // Roving tabindex: first vine is tab-stop; siblings reachable via arrows.
      img.tabIndex = scene.querySelector('.roving-vine') ? -1 : 0;
    }
    scene.append(img);
    return img;
  }

  function handleVineKey(event) {
    const dir = event.key === 'ArrowRight' ? 1 : event.key === 'ArrowLeft' ? -1 : 0;
    const jumpFirst = event.key === 'Home';
    const jumpLast  = event.key === 'End';
    if (!dir && !jumpFirst && !jumpLast) return;
    event.preventDefault();
    const vines = Array.from(scene.querySelectorAll('.roving-vine'))
      .sort((a, b) => parseFloat(a.style.left) - parseFloat(b.style.left));
    if (!vines.length) return;
    const cur = vines.indexOf(event.currentTarget);
    let next;
    if (jumpFirst) next = vines[0];
    else if (jumpLast) next = vines[vines.length - 1];
    else next = vines[(cur + dir + vines.length) % vines.length];
    vines.forEach((v) => (v.tabIndex = -1));
    next.tabIndex = 0;
    next.focus();
  }

  function updateInfoFromProject(project, options) {
    const reveal = !options || options.reveal !== false;
    const stage = Number(project.stage || 1);
    const name = project.display_name || '本地智能体花园';
    const total = project.total_tokens || 0;
    const label = document.getElementById('garden-info-label');
    const title = document.getElementById('garden-info-name');
    const token = document.getElementById('garden-info-total');
    const stageEl = document.getElementById('garden-info-stage');
    const fill = document.getElementById('garden-info-fill');
    if (label) label.textContent = '项目藤 · 当前选中';
    if (title) title.textContent = name;
    if (token) token.textContent = '累计 ' + fmtLocal(total);
    if (stageEl) stageEl.textContent = '阶段 ' + stage + ' / 6';

    if (reveal) {

  function showInfoCard(event) {
    const card = document.querySelector('.pg6-info');
    if (!card) return;
    if (event) positionInfoCard(event);
    card.classList.add('is-visible');
  }

  function positionInfoCard(event) {
    const card = document.querySelector('.pg6-info');
    if (!card || !event) return;
    const rect = scene.getBoundingClientRect();
    const cardRect = card.getBoundingClientRect();
    const gap = 14;
    const pad = 10;
    let x = event.clientX - rect.left + gap;
    let y = event.clientY - rect.top - cardRect.height / 2;

    if (x + cardRect.width > rect.width - pad) {
      x = event.clientX - rect.left - cardRect.width - gap;
    }
    x = Math.max(pad, Math.min(rect.width - cardRect.width - pad, x));
    y = Math.max(pad, Math.min(rect.height - cardRect.height - pad, y));

    card.style.setProperty('--info-x', x + 'px');
    card.style.setProperty('--info-y', y + 'px');
    card.style.setProperty('--info-bottom', 'auto');
  }

  // Position the card NEXT TO a DOM element (vs. next to the cursor).
  // Used by: keyboard focus, chip hover (anchors to the corresponding vine),
  // trinket hover, cat hover. If the anchor is outside the scene (e.g. a
  // chip below it), we pin the card to the scene's top and pick a side based
  // on the anchor's horizontal position.
  function positionInfoCardFromElement(anchor) {
    const card = document.querySelector('.pg6-info');
    if (!card || !anchor) return;
    const sceneRect = scene.getBoundingClientRect();
    const a = anchor.getBoundingClientRect();
    const cardW = card.offsetWidth || 200;
    const cardH = card.offsetHeight || 100;
    const gap = 14;
    const pad = 10;

    const aCx = a.left + a.width / 2 - sceneRect.left;
    // Side: put card on the side with more room
    let x = aCx < sceneRect.width / 2
      ? (a.right - sceneRect.left) + gap
      : (a.left - sceneRect.left) - cardW - gap;
    x = Math.max(pad, Math.min(sceneRect.width - cardW - pad, x));

    let y;
    const aTop = a.top - sceneRect.top;
    const aBottom = a.bottom - sceneRect.top;
    if (aBottom < 0 || aTop > sceneRect.height) {
      // Anchor is fully outside scene vertically (chip case): pin near top.
      y = pad;
    } else {
      // Align card vertically with the anchor's center.
      y = (aTop + aBottom) / 2 - cardH / 2;
    }
    y = Math.max(pad, Math.min(sceneRect.height - cardH - pad, y));

    card.style.setProperty('--info-x', x + 'px');
    card.style.setProperty('--info-y', y + 'px');
    card.style.setProperty('--info-bottom', 'auto');
  }

  function hideInfoCard() {
    // Remove .is-visible — CSS transition handles the fade-out.
    // If the user immediately enters another vine, updateInfoFromProject
    // re-adds the class mid-fade and the transition reverses smoothly.
    const card = document.querySelector('.pg6-info');
    if (card) card.classList.remove('is-visible');
  }

  function setActiveProject(index) {
    document.querySelectorAll('.roving-vine, .pg6-project-chip').forEach((el) => {
      el.classList.toggle('is-active', el.dataset.projectIndex === String(index));
    });
  }

  function clearActiveProject() {
    document.querySelectorAll('.roving-vine, .pg6-project-chip').forEach((el) => {
      el.classList.remove('is-active');
    });
  }

  function fmtLocal(value) {
    if (value >= 1000000) return (value / 1000000).toFixed(1) + 'M';
    if (value >= 1000) return (value / 1000).toFixed(1) + 'k';
    return String(value || 0);
  }

  function updateDefaultInfo(summary, projects) {
    // Pre-fill the info card content but do NOT make it visible — the card
    // only appears once the user hovers or focuses a project vine.
    const project = projects[0];
    if (project) updateInfoFromProject(project, { reveal: false });
    const app = document.querySelector('.pg6-app');
    const total = summary ? summary.total_tokens : projects.reduce((sum, item) => sum + (item.total_tokens || 0), 0);
    if (app) app.textContent = '像素花园 · ' + fmtLocal(total) + ' local tokens';
  }

  function updateLegend(tiers, projects) {

    if (light) light.textContent = tiers.lamp === 'lit' ? '石灯 · 今日活动已点亮' : '石灯 · 今日尚未点亮';
  }

  function tierLabel(value) {
    return ({ small: '初建', mid: '成形', full: '完整' })[value] || value;
  }

  function cherryLabel(value) {
    return ({ bud: '花苞', bloom: '盛开', petal: '落樱' })[value] || value;

  function renderProjectStrip(projects) {
    const strip = document.getElementById('project-strip');
    if (!strip) return;
    if (!projects.length) {
      strip.innerHTML = '';
      return;
    }
    strip.innerHTML = projects.map((project, index) => {
      return '<button class="pg6-project-chip" type="button" data-project-index="' + index + '"><span>' + (index + 1) + '</span><strong>' + escapeHtml(project.display_name || 'unknown') + '</strong><span>' + fmtLocal(project.total_tokens || 0) + '</span></button>';
    }).join('');
    strip.querySelectorAll('.pg6-project-chip').forEach((chip, index) => {
      const project = projects[index];
      // Chip hover/focus anchors the info card to the corresponding vine on
      // the wall — the chip itself lives below the scene, so cursor-based
      // positioning would push the card out of bounds.
      const anchorToVine = () => {
        setActiveProject(index);
        updateInfoFromProject(project);
        const vine = scene.querySelector('.roving-vine[data-project-index="' + index + '"]');
        positionInfoCardFromElement(vine || chip);
      };
      chip.addEventListener('mouseenter', anchorToVine);
      chip.addEventListener('focus', anchorToVine);
      chip.addEventListener('mouseleave', () => {
        clearActiveProject();
        hideInfoCard();
      });
      chip.addEventListener('blur', () => {
        clearActiveProject();
        hideInfoCard();
      });
    });
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (char) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    })[char]);
  }

  function pick(group, seed) {
    return group[Math.abs(seed) % group.length];
  }

  function namedSprite(group, name) {
    return group.find((sprite) => sprite.name === name);
  }

  function jitter(a, b) {
    const x = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453;
    return x - Math.floor(x);
  }
})();
</script>
</body>
