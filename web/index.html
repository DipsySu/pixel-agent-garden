<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Agent Garden</title>
<style>
:root {
  --color-background-secondary: #171b14;
  --color-text-primary: #f4ead8;
  --color-text-secondary: #b9af9b;
  --color-text-tertiary: #8f8778;
  --color-border-tertiary: rgba(255,255,255,0.12);
  --border-radius-lg: 10px;
  --border-radius-md: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: clamp(10px, 3vw, 20px);
  background: #10140f;
  color: var(--color-text-primary);
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  overflow-x: hidden;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.pg6-wrap { max-width: 980px; min-width: 0; width: 100%; }
.pg6-wrap { padding: 0.5rem 0; }
.pg6-frame { background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 14px; }
.pg6-header { display: flex; justify-content: space-between; align-items: center; gap: 8px 14px; padding: 2px 6px 12px; flex-wrap: wrap; }
.pg6-app { font-size: 13px; font-weight: 500; color: var(--color-text-primary); letter-spacing: 0.3px; min-width: 0; }
.pg6-meta { font-size: 12px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-width: 0; }
.pg6-meta-item { display: flex; align-items: center; gap: 5px; }
.pg6-icon { color: currentColor; flex: 0 0 auto; height: 13px; width: 13px; }
.pg6-scene { position: relative; border-radius: var(--border-radius-md); overflow: hidden; line-height: 0; }
.pg6-scene svg { display: block; width: 100%; height: auto; }
.pg6-sprite {
  /* --vine-hue-shift is set per-project via JS to tint each vine by primary
     source (claude-code = 0deg / default; codex = bluer; mixed = somewhere
     in between). Non-project sprites keep the 0deg default → no tint. */
  filter: saturate(0.78) brightness(0.9) contrast(0.96) hue-rotate(var(--vine-hue-shift, 0deg));
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  pointer-events: auto;
  position: absolute;
  transform: var(--sprite-transform, translate(-50%, 0));
  transform-origin: top center;
  transition: filter 140ms ease, opacity 140ms ease, transform 140ms ease;
  user-select: none;
}
.pg6-sprite.project {
  cursor: pointer;
}
.pg6-sprite.vine-cap {
  filter: saturate(0.76) brightness(0.86) contrast(0.94) hue-rotate(var(--vine-hue-shift, 0deg));
  pointer-events: none;
  transform-origin: center center;
}
.pg6-sprite.vine-cornice {
  /* Match the vine tone (.pg6-sprite base filter) so cornice + vines read as
     one continuous plant rather than two stacked bands of foliage. */
  filter: saturate(0.78) brightness(0.92) contrast(0.96) hue-rotate(var(--vine-hue-shift, 0deg));
  pointer-events: none;
  transform-origin: bottom center;
}
.pg6-sprite.project:hover {
  filter: saturate(0.92) brightness(0.98) contrast(0.98) hue-rotate(var(--vine-hue-shift, 0deg));
  opacity: 0.92 !important;
  transform: var(--sprite-transform, translate(-50%, 0)) translateY(-3px) scale(1.04);
}
.pg6-sprite.project.is-active {
  filter: saturate(1.02) brightness(1.05) contrast(1.02) hue-rotate(var(--vine-hue-shift, 0deg));
  opacity: 0.96 !important;
}
.pg6-sprite.project:focus-visible {
  filter: saturate(0.98) brightness(1.03) contrast(1) hue-rotate(var(--vine-hue-shift, 0deg));
  outline: 2px solid rgba(244, 216, 120, 0.9);
  outline-offset: 2px;
  opacity: 0.95 !important;
  transform: var(--sprite-transform, translate(-50%, 0)) translateY(-3px) scale(1.04);
}
.pg6-sprite.ground {
  filter: saturate(0.72) brightness(0.86) contrast(0.92);
  transform-origin: bottom center;
}
/* Foreground objects (cherry / willow / shrine / pavilion / etc.) — full
   opacity, minimal filtering so the new pixel-art sprites read at their
   intended vividness. The .ground class stays for atmospheric stuff like
   grass tufts and small rocks that should recede. */
.pg6-sprite.object {
  filter: saturate(0.97) brightness(0.98);
  transform-origin: bottom center;
}
.pg6-sprite.flower {
  filter: saturate(0.82) brightness(0.92) contrast(0.96);
}
.pg6-sprite.mark {
  mix-blend-mode: multiply;
}
.pg6-wall-edge-cover {
  background: #48382a;
  height: clamp(2px, 0.8%, 6px);
  left: 0;
  opacity: 0.28;
  pointer-events: none;
  position: absolute;
  top: 25%;
  width: 100%;
  z-index: 15;
}
/* (.pg6-vine-seam-shadow removed — the cornice itself now does the green→brick
   transition. The shadow's tail extending below the cornice was reading as a
   visible horizontal line that re-introduced "two-layer" feel.) */
.pg6-info {
  position: absolute;
  left: var(--info-x, 14px);
  top: var(--info-y, auto);
  bottom: var(--info-bottom, 14px);
  background: rgba(28, 18, 10, 0.86); color: #f5ead8;
  padding: 10px 14px; border-radius: 8px;
  font-size: 12px; min-width: 180px; line-height: 1.5;
  opacity: 0; pointer-events: none;
  transform: translateY(4px);
  transition: opacity 180ms ease, transform 180ms ease;
  /* Sit above every vine (z~18-33), trinket (z~40+), and cornice (z=61+).
     Without this, hovering a wide vine would have its trailing leaves drape
     over the card and partially hide the text. */
  z-index: 200;
}
.pg6-info.is-visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
.pg6-trinket-sprite {
  cursor: pointer;
  transform-origin: center center;
}
.pg6-trinket-sprite:hover,
.pg6-trinket-sprite:focus-visible {
  filter: saturate(1.08) brightness(1.08);
  outline: 2px solid rgba(244, 216, 120, 0.82);
  outline-offset: 1px;
  transform: var(--sprite-transform, translate(-50%, -50%)) scale(1.18);
}
.pg6-scene[data-time-mode="night"] .pg6-sprite.decor-lantern,
.pg6-scene[data-time-mode="dusk"] .pg6-sprite.decor-lantern.is-lit {
  filter: saturate(1.18) brightness(1.18) drop-shadow(0 0 5px rgba(240, 160, 96, 0.55));
}
.pg6-scene[data-time-mode="day"] .pg6-sprite.decor-lantern.is-dim {
  filter: saturate(0.7) brightness(0.88);
}
.pg6-scene[data-motion="off"] .pg6-sprite,
.pg6-scene[data-motion="off"] .pg6-info {
  animation: none !important;
  transition-duration: 0ms !important;
}
@media (prefers-reduced-motion: no-preference) {
  .pg6-trinket-sprite { animation: pg6-trinket-nod 3600ms ease-in-out infinite; }
  .pg6-sprite.project.hanging { animation: pg6-vine-sway 4200ms ease-in-out infinite; }
  .pg6-sprite.project.climbing { animation: pg6-vine-breathe 5200ms ease-in-out infinite; }
  .pg6-sprite.decor-lantern.is-lit { animation: pg6-lantern-pulse 2200ms ease-in-out infinite; }
  .pg6-petal { animation: pg6-petal-fall var(--petal-duration, 9s) linear infinite; }
  @keyframes pg6-trinket-nod {
    0%, 100% { filter: saturate(0.97) brightness(0.98); }
    50%      { filter: saturate(1.05) brightness(1.06); }
  }
  @keyframes pg6-vine-sway {
    0%, 100% { filter: saturate(0.78) brightness(0.90) contrast(0.96) hue-rotate(var(--vine-hue-shift, 0deg)); }
    50%      { filter: saturate(0.88) brightness(0.96) contrast(0.98) hue-rotate(var(--vine-hue-shift, 0deg)); }
  }
  @keyframes pg6-vine-breathe {
    0%, 100% { opacity: 0.62; }
    50%      { opacity: 0.72; }
  }
  @keyframes pg6-lantern-pulse {
    0%, 100% { filter: saturate(1.12) brightness(1.08) drop-shadow(0 0 4px rgba(240, 160, 96, 0.45)); }
    50%      { filter: saturate(1.22) brightness(1.22) drop-shadow(0 0 7px rgba(240, 160, 96, 0.65)); }
  }
  @keyframes pg6-petal-fall {
    0%   { opacity: 0; transform: translate3d(0, -8px, 0) rotate(0deg); }
    10%  { opacity: 0.65; }
    90%  { opacity: 0.55; }
    100% { opacity: 0; transform: translate3d(var(--petal-drift, 18px), 120px, 0) rotate(160deg); }
  }
}
.pg6-info-label { opacity: 0.65; font-size: 11px; }
.pg6-info-name { font-weight: 500; margin: 2px 0 6px; font-size: 13px; }
.pg6-info-row { display: flex; justify-content: space-between; font-size: 11px; opacity: 0.85; }
.pg6-info-bar { margin-top: 7px; height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; overflow: hidden; }
.pg6-info-fill { width: 62%; height: 100%; background: #7ac46e; }
.pg6-project-strip { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 6px 0; }
.pg6-project-chip { align-items: center; background: none; border: 0; color: var(--color-text-secondary); cursor: pointer; display: inline-flex; flex: 0 1 180px; font: inherit; font-size: 11px; gap: 5px; max-width: 180px; min-width: 0; overflow: hidden; padding: 0; }
.pg6-project-chip::before { background: #6f9b48; content: ""; display: inline-block; flex: 0 0 auto; height: 8px; width: 8px; }
.pg6-project-chip strong { color: var(--color-text-primary); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg6-project-chip:hover,
.pg6-project-chip:focus-visible,
.pg6-project-chip.is-active { color: var(--color-text-primary); outline: none; }
.pg6-project-chip:hover::before,
.pg6-project-chip:focus-visible::before,
.pg6-project-chip.is-active::before { background: #9fd36d; box-shadow: 0 0 0 1px rgba(244, 216, 120, 0.35); }
.pg6-legend { display: flex; gap: 14px; padding: 12px 6px 2px; font-size: 11px; color: var(--color-text-secondary); flex-wrap: wrap; }
.pg6-legend-item { display: flex; align-items: center; gap: 6px; }
.pg6-legend-dot { width: 9px; height: 9px; border-radius: 1px; flex-shrink: 0; }
.pg6-footer { padding: 10px 6px 0; font-size: 11px; color: var(--color-text-tertiary); display: flex; align-items: center; gap: 5px; border-top: 0.5px solid var(--color-border-tertiary); margin-top: 12px; flex-wrap: wrap; }
.pg6-footer-freshness { color: var(--color-text-tertiary); margin-left: auto; }
.pg6-footer-freshness.is-stale { color: #d6a258; cursor: help; }
.pg6-sprite.cat-interactive { cursor: pointer; }
.pg6-sprite.cat-interactive:hover {
  filter: saturate(1.05) brightness(1.04);
  transform: var(--sprite-transform, translate(-50%, 0)) translateY(-2px) scale(1.03);
}
.pg6-sprite.cat-interactive:focus-visible {
  outline: 2px solid rgba(244, 216, 120, 0.9);
  outline-offset: 2px;
  filter: saturate(1.08) brightness(1.06);
  transform: var(--sprite-transform, translate(-50%, 0)) translateY(-2px) scale(1.03);
}
.pg6-empty {
  background: rgba(23, 27, 20, 0.84);
  border: 1px solid rgba(244, 234, 216, 0.14);
  border-radius: 8px;
  color: #f4ead8;
  left: 50%;
  line-height: 1.5;
  padding: 12px 16px;
  position: absolute;
  text-align: center;
  top: 58%;
  transform: translate(-50%, -50%);
  width: min(82%, 360px);
  z-index: 50;
}
.pg6-empty-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.pg6-empty-code { color: #b9af9b; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
.pg6-petal {
  background: #f4b8c8;
  height: 3px;
  left: var(--petal-x, 20%);
  opacity: 0;
  pointer-events: none;
  position: absolute;
  top: var(--petal-y, 70%);
  width: 2px;
  z-index: 45;
}
@media (max-width: 520px) {
  body { display: block; min-width: 0; }
  .pg6-wrap { margin: 0 auto; max-width: none; width: calc(100vw - 20px); }
  .pg6-frame { max-width: 100%; overflow: hidden; padding: 10px; width: 100%; }
  .pg6-header { align-items: flex-start; display: block; }
  .pg6-meta { gap: 8px; justify-content: flex-start; margin-top: 8px; }
  .pg6-project-strip { gap: 6px 10px; }
  .pg6-project-chip { flex-basis: calc(50% - 6px); max-width: calc(50% - 6px); }
  /* On narrow screens, the bottom-left info card covers most of the wall.
     Move it to the top edge as a thin strip — it overlays the sky area
     which has less critical detail. */
  .pg6-info {
    top: 8px; bottom: auto; left: 8px; right: 8px;
    min-width: 0; padding: 6px 10px;
    font-size: 11px; line-height: 1.35;
  }
  .pg6-info-name { font-size: 12px; margin: 1px 0 3px; }
  .pg6-info-bar { margin-top: 4px; }
}

/* Respect users who don't want motion. Filter/opacity changes still happen instantly. */
@media (prefers-reduced-motion: reduce) {
  .pg6-sprite,
  .pg6-info {
    animation: none !important;
    transition-duration: 0ms !important;
  }
}
</style>
</head>
<body>

<h2 class="sr-only">像素花园·春·傍晚:本机 AI agent 活动化作墙沿垂落或墙根攀爬的项目藤。使用 Tab 进入项目藤列表,左右方向键在藤之间切换。</h2>

<div class="pg6-wrap">
  <div class="pg6-frame">
    <div class="pg6-header">
      <div class="pg6-app">像素花园 · 你的数字庭院</div>
      <div class="pg6-meta">
        <span class="pg6-meta-item"><svg class="pg6-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c2-5 7-3 6 2 5-1 7 4 2 6 3 4-1 8-5 5-2 5-7 3-6-2-5 1-7-4-2-6-3-4 1-8 5-5Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg><span id="meta-season">春 · 谷雨</span></span>
        <span class="pg6-meta-item"><svg class="pg6-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16h16M7 20h10M6 12a6 6 0 0 1 12 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="meta-time">傍晚 · 18:42</span></span>
      </div>
    </div>
    <div class="pg6-scene" id="pg6-scene"></div>
    <div class="pg6-project-strip" id="project-strip" aria-label="项目藤列表"></div>
    <div class="pg6-legend">
      <div class="pg6-legend-item"><span class="pg6-legend-dot" style="background:#4a7235"></span><span id="legend-vines">项目藤 · 本地 agent 活动</span></div>
      <div class="pg6-legend-item"><span class="pg6-legend-dot" style="background:#7a7068"></span><span id="legend-courtyard">庭院物件 · 等待数据</span></div>
      <div class="pg6-legend-item"><span class="pg6-legend-dot" style="background:#e89aae"></span><span id="legend-bloom">花草 · 等待数据</span></div>
      <div class="pg6-legend-item"><span class="pg6-legend-dot" style="background:#f0a060"></span><span id="legend-light">夕阳 · 春日 18:42</span></div>
    </div>
    <div class="pg6-footer">
      <svg class="pg6-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 6v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6l8-3Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 12 3 3 5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>仅读取本机 agent 数据 · 零网络请求</span>
      <span id="data-freshness" class="pg6-footer-freshness"></span>
    </div>
  </div>
</div>

<script type="module" src="./garden.js"></script>

</body>
</html>
