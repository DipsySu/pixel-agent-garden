name: Release

# Tag-driven releases (push a v* tag) build bundles on all three desktop
# platforms and publish a GitHub Release. Manual dispatch can validate bundles
# without a release, or publish a release when `release_tag` is provided.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to publish, e.g. v0.1.0'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.release_tag }}
  RELEASE_BODY: |
    Community build. Current install and unsigned-build notes:
    https://github.com/DipsySu/pixel-agent-garden/blob/main/docs/unsigned-installs.md

jobs:
  # Gate before ANY bundle is built or published: a `v*` tag must clear the same
  # zero-network / quality checks CI enforces on main (see PRIVACY.md). Without
  # this, pushing a tag could publish a release from a commit that never passed
  # CI. `build` depends on it, so a failed gate blocks the release.
  preflight:
    name: preflight (gate before publish)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Tag version matches crate + bundle version
        if: env.RELEASE_TAG != ''
        run: |
          # A v* tag must ship the version it names: guard against a `v2.0.1`
          # tag publishing `2.0.0` binaries. Compare the tag (sans leading v)
          # against the tauri-app crate version and the bundle version in
          # tauri.conf.json — the two that actually stamp the artifact.
          want="${RELEASE_TAG#v}"
          conf=$(grep -m1 '"version"' crates/tauri-app/tauri.conf.json | sed -E 's/.*"version" *: *"([^"]+)".*/\1/')
          cargo_v=$(grep -m1 '^version' crates/tauri-app/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$want  tauri.conf.json=$conf  Cargo.toml=$cargo_v"
          if [ "$want" != "$conf" ] || [ "$want" != "$cargo_v" ]; then
            echo "::error::Release tag v$want disagrees with tauri.conf.json ($conf) / Cargo.toml ($cargo_v) — bump the version to match the tag before publishing."
            exit 1
          fi
          echo "OK — tag, crate, and bundle versions all agree ($want)."
      - name: No network / telemetry client crates in Cargo.lock
        run: |
          # Keep this list in sync with .github/workflows/ci.yml and deny.toml.
          banned='ureq|isahc|surf|attohttpc|curl|curl-sys|sentry|sentry-core|opentelemetry|tracing-opentelemetry|tungstenite|tokio-tungstenite|async-tungstenite|websocket|axum|warp|actix-web|rocket|tiny_http|rouille|quinn|lettre|ssh2'
          if grep -nE "^name = \"($banned)\"$" Cargo.lock; then
            echo "::error::A network/telemetry crate entered Cargo.lock — violates the zero-network contract (see PRIVACY.md)."
            exit 1
          fi
          echo "OK — no egress/telemetry client crates in Cargo.lock."
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            patchelf \
            libfuse2 \
            build-essential \
            libxdo-dev \
            libssl-dev \
            file
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-preflight
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: node --test "web/tests/**/*.test.mjs"
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans sources

  build:
    name: build (${{ matrix.platform }})
    needs: preflight
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' && secrets.WINDOWS_CERTIFICATE_THUMBPRINT != '' }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--bundles app,dmg'
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
          - platform: windows-latest
            args: '--bundles nsis'
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            patchelf \
            libfuse2 \
            build-essential \
            libxdo-dev \
            libssl-dev \
            file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      - name: Report signing mode
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)
              if [[ "$HAS_APPLE_SIGNING" == "true" ]]; then
                echo "macOS signing secrets present; importing Developer ID certificate."
              else
                echo "macOS signing secrets missing; building unsigned."
              fi
              ;;
            Windows)
              if [[ "$HAS_WINDOWS_SIGNING" == "true" ]]; then
                echo "Windows signing secrets present; importing PFX certificate."
              else
                echo "Windows signing secrets missing; building unsigned."
              fi
              ;;
            *)
              echo "$RUNNER_OS build does not require code-signing secrets."
              ;;
          esac

      - name: Import Apple Developer certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Resolve Apple signing identity
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep -E '"(Developer ID Application|Apple Distribution|Apple Development):' | head -n 1)
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          if [[ -z "$CERT_ID" ]]; then
            echo "No usable Apple code-signing identity found in build.keychain." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate\certificate.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate\certificate.txt certificate\certificate.pfx
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath certificate\certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure

      # tauri-action runs `tauri build`, finds the config under projectPath,
      # and uploads bundles only when a tag name is provided.
      - name: Build and publish signed macOS release
        if: env.RELEASE_TAG != '' && runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: crates/tauri-app
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Local Agent Garden ${{ env.RELEASE_TAG || github.sha }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build and publish signed Windows release
        if: env.RELEASE_TAG != '' && runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/tauri-app
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Local Agent Garden ${{ env.RELEASE_TAG || github.sha }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          args: >-
            ${{ matrix.args }}
            --config '{"bundle":{"windows":{"certificateThumbprint":"${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}","digestAlgorithm":"sha256","timestampUrl":"${{ env.WINDOWS_TIMESTAMP_URL }}"}}}'

      - name: Build and publish unsigned release
        if: >-
          env.RELEASE_TAG != '' &&
          !(runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true') &&
          !(runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/tauri-app
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Local Agent Garden ${{ env.RELEASE_TAG || github.sha }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build bundles only
        if: env.RELEASE_TAG == ''
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/tauri-app
          args: ${{ matrix.args }}
