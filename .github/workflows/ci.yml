name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  web-tests:
    name: web tests (node --test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          # The clearance test replays fbe3847 from git history; a shallow
          # clone would skip that replay.
          fetch-depth: 0
      # Runner-preinstalled Node is enough: the web/ tests are plain ESM with
      # zero npm dependencies (repo rule: no bundler, no packages).
      - run: node --test "web/tests/**/*.test.mjs"
      # Landmark footprints in addCourtyardObjects. Kept as its own step so the
      # command that failed on the June 2026 overlaps is the command CI runs.
      # COURTYARD_REPLAY_REQUIRED turns a missing fbe3847 into a failure.
      - name: Courtyard landmark clearance
        run: node --test web/tests/courtyard-clearance.test.mjs
        env:
          COURTYARD_REPLAY_REQUIRED: '1'

  verify-harness:
    name: verify harness regressions (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # macOS has no getent and symlinked /tmp; Linux has both. The harness
        # must hold on each.
        platform: [ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Shell syntax
        run: for f in .claude/skills/verify-pixel-agent-garden/scripts/*.sh .claude/skills/verify-pixel-agent-garden/tests/*.sh; do bash -n "$f"; done
      - name: control.sh / launch-site.sh / agent-garden.sh regressions
        run: bash .claude/skills/verify-pixel-agent-garden/tests/harness-regressions.sh
      # A stock Mac resolves `#!/usr/bin/env bash` to /bin/bash 3.2, where an
      # empty array under `set -u` is an error.
      - name: Same regressions under stock macOS /bin/bash 3.2
        if: runner.os == 'macOS'
        run: |
          shim="$(mktemp -d)"
          ln -s /bin/bash "$shim/bash"
          PATH="$shim:$PATH" /bin/bash .claude/skills/verify-pixel-agent-garden/tests/harness-regressions.sh

  supply-chain:
    name: supply-chain (zero-network gate)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: No new network / telemetry client crates in Cargo.lock
        run: |
          # Egress / server / telemetry crates the app must never add. reqwest,
          # hyper, tokio, url are baseline Tauri 2.x deps and are intentionally NOT
          # listed (see PRIVACY.md). Keep this in sync with deny.toml [bans].
          banned='ureq|isahc|surf|attohttpc|curl|curl-sys|sentry|sentry-core|opentelemetry|tracing-opentelemetry|tungstenite|tokio-tungstenite|async-tungstenite|websocket|axum|warp|actix-web|rocket|tiny_http|rouille|quinn|lettre|ssh2'
          if grep -nE "^name = \"($banned)\"$" Cargo.lock; then
            echo "::error::A network/telemetry crate entered Cargo.lock — violates the zero-network contract (see PRIVACY.md)."
            exit 1
          fi
          echo "OK — no new egress/telemetry client crates in Cargo.lock."
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny (advisories + bans + sources)
        run: cargo deny check advisories bans sources

  clippy-test:
    name: clippy + test (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      # Tauri 2 on Linux needs the webkit2gtk-4.1 stack + appindicator (for the
      # tray planned in P3-2). macOS / Windows runners ship what's needed.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            patchelf \
            build-essential \
            libxdo-dev \
            libssl-dev \
            file

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
